<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://store.storeimages.cdn-apple.com https://i.pinimg.com; connect-src https://docs.google.com https://*.googleusercontent.com; frame-src https://maps.google.com https://www.google.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>iMarket — Premium reseller Apple · Астана, Орал, Атырау</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--card2:#f2f2f4;--line:rgba(0,0,0,.1);--mut:#6e6e73;--txt:#1d1d1f;--blue:#0a84ff;--wa:#25d366;--red:#ff453a;--r:20px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{font-family:Montserrat,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px;width:100%;height:50px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;outline:none}
input:focus,select:focus{border-color:var(--blue)}
button{cursor:pointer;border:0;background:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
.sec{padding:40px 0;border-top:1px solid var(--line)}
.alt{background:#f5f5f7}
h1{font-size:clamp(30px,8.4vw,60px);line-height:1.07;letter-spacing:-.02em;font-weight:800}
h2{font-size:clamp(24px,6vw,36px);letter-spacing:-.01em;font-weight:800}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:15px;text-align:center;transition:transform .15s}
.btn:active{transform:scale(.97)}
.b-w{background:#1d1d1f;color:#fff}.b-d{background:var(--card2);border:1px solid var(--line)}
.b-wa{background:var(--wa);color:#000}.b-b{background:var(--blue);color:#fff}.b-r{background:#e5352b;color:#fff}

/* top + header */
.top{font-size:12px;color:#6e6e73;background:#f5f5f7;border-bottom:1px solid var(--line);text-align:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.top b{color:#c77700}
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.bar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo i{font-style:normal;width:36px;height:36px;border-radius:11px;background:#1d1d1f;color:#fff;display:grid;place-items:center;font-weight:800}
.logo b{display:block;font-size:16px;line-height:1}.logo span{font-size:11px;color:var(--mut)}
.nav{display:none;gap:28px;font-size:14px;color:#6e6e73}.nav a:hover{color:#000}
.hcall{display:flex;gap:8px;align-items:center}
.ico{width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.hwa{display:none;min-height:42px;padding:0 18px;border-radius:999px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 0 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#f2f2f4;color:#6e6e73;font-weight:600;font-size:13px;display:inline-flex;align-items:center}
.chip.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}

/* hero */
.hero{padding:28px 0 36px;background:radial-gradient(70% 45% at 50% 0%,rgba(10,132,255,.12),transparent 70%)}
.hgrid{display:grid;gap:28px}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:#3a3a3c;background:rgba(0,0,0,.05);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:#30d158}
.hero h1{margin:16px 0 14px}
.hero p.lead{font-size:16px;color:#6e6e73;max-width:460px}
.cta{display:grid;gap:10px;margin-top:22px;max-width:440px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px;max-width:440px}
.stat{padding:12px 14px}.stat b{font-size:18px;display:block}.stat span{font-size:12px;color:var(--mut)}
.feat{padding:18px}
.feat .row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.tag{background:rgba(10,132,255,.16);color:var(--blue);font-weight:700;border-radius:999px;padding:5px 11px}
.ok{color:#30d158}
.feat img{height:min(56vw,260px);width:auto;margin:14px auto;object-fit:contain;filter:drop-shadow(0 18px 26px rgba(0,0,0,.6))}
.feat h3{font-size:20px}.feat .sub{font-size:13px;color:var(--mut)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.price{font-size:24px;font-weight:800}.inst{font-size:12px;color:var(--mut)}

/* catalog */
.head p{font-size:14px;color:var(--mut);margin-top:4px}
.search{margin-top:16px}
.filters{position:sticky;top:104px;z-index:30;margin:12px -16px 0;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-block:1px solid rgba(0,0,0,.06)}
.filters::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.p{padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.pimg{background:#f5f5f7;border-radius:14px;aspect-ratio:1.07/1;display:grid;place-items:center}
.pimg img{height:112px;width:auto;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
.p h3{font-size:15px;margin-top:12px;line-height:1.2}.p .d{font-size:12px;color:var(--mut);margin-top:3px}
.mems{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mem{flex:1 1 calc(50% - 3px);min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:#6e6e73;font-size:12px;font-weight:600}
.mem.on{background:rgba(10,132,255,.1);border-color:var(--blue);color:#0066cc}
.pfoot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pfoot .pr{font-size:18px;font-weight:800}.pfoot .btn{margin-top:10px;min-height:46px;font-size:14px;width:100%}
.empty{display:none;padding:22px;margin-top:16px;text-align:center}.empty .btn{margin-top:14px}

/* installment */
.two{display:grid;gap:22px}
.red{display:inline-block;font-size:12px;font-weight:700;color:#ff6b61;background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.25);border-radius:999px;padding:5px 12px;margin-bottom:10px}
.two ul{list-style:none;margin-top:14px;font-size:14px;color:#3a3a3c;display:grid;gap:8px}
.two li::before{content:"✓ ";color:#1a9c3e}
.calc{padding:18px}.calc label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}.calc h3{font-size:16px}
.mo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mo .mem{flex:none}
.res{margin-top:16px;border-radius:16px;background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.25);padding:14px;text-align:center}
.res span{font-size:13px;color:#6e6e73}.res b{display:block;font-size:30px;color:var(--red);font-weight:900}
.calc .btn{margin-top:14px;width:100%}

/* trade-in, faq, contacts */
.narrow{width:min(620px,100% - 32px);margin-inline:auto}
form.card{padding:18px;margin-top:20px;display:grid;gap:14px}
form label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:15px}
summary::-webkit-details-marker{display:none}
summary i{font-style:normal;font-size:24px;color:var(--blue);transition:transform .25s}
details[open] summary i{transform:rotate(45deg)}
details p{padding:0 0 16px;color:#6e6e73;font-size:14px;line-height:1.55}
.info{display:grid;gap:10px;margin-top:16px}
.info .card{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#6e6e73}
.info b{display:block;color:var(--txt);font-size:15px}.info em{font-style:normal;font-size:22px}
.map{height:280px;border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.map iframe{width:100%;height:100%;border:0;filter:none}
footer{border-top:1px solid var(--line);padding:22px 16px;text-align:center;font-size:12px;color:var(--mut)}

/* bottom bar (phones) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.dock .btn{flex:1;min-height:50px;font-size:14px}.dock .btn:last-child{flex:1.4}

/* very small phones */
@media(max-width:340px){.grid{grid-template-columns:1fr}}
/* large phones / small tablets */
@media(min-width:600px){
 .cta{grid-template-columns:1fr 1fr;max-width:520px}.stats{grid-template-columns:repeat(4,1fr);max-width:560px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.hwa{display:flex}
}
/* tablets & desktop */
@media(min-width:900px){
 body{padding-bottom:0}.dock,.chips{display:none}.nav{display:flex}
 .filters{top:58px}.sec{padding:72px 0}.hero{padding:64px 0 80px}
 .hgrid{grid-template-columns:1.15fr .85fr;align-items:center;gap:48px}
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
 .two{grid-template-columns:1fr 1fr;align-items:center;gap:48px}
 .contacts{display:grid;grid-template-columns:5fr 7fr;gap:32px;align-items:stretch}.map{height:auto;min-height:340px}
 html{scroll-padding-top:90px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.lang{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{min-height:36px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;color:#6e6e73}.lang button.on{background:#1d1d1f;color:#fff}
.brs{padding:18px}.brs h3{font-size:18px}.brs>p{font-size:13px;color:var(--mut);margin:2px 0 14px}
.br{padding:14px 0;border-top:1px solid var(--line)}.br b{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.br small{font-size:11px;font-weight:700;color:#30d158;background:rgba(48,209,88,.12);border-radius:999px;padding:3px 9px}
.br div{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.br .btn{min-height:44px;font-size:13px}
.btn.dis{opacity:.35;pointer-events:none}
.ph{width:62px;height:116px;border-radius:16px;border:2px solid #3b3b3f;background:linear-gradient(160deg,#2c2c30,#0f0f10);position:relative;box-shadow:0 14px 22px rgba(0,0,0,.6)}
.ph.pro{background:linear-gradient(160deg,#7a6552,#2b231d);border-color:#8a7560}
.ph i{position:absolute;left:6px;width:13px;height:13px;border-radius:50%;background:#050505;border:2px solid #55555a}
.ph i:nth-child(1){top:7px}.ph i:nth-child(2){top:24px}.ph i:nth-child(3){top:41px}
.pb{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.pb .btn{margin-top:0!important}
.pfoot .pr.q{font-size:14px;color:#c77700}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tbl{margin-top:14px;overflow:hidden}.tr{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}.tr>span{grid-column:1/-1;font-size:12px;color:var(--mut);padding:12px 14px 0;text-transform:uppercase;letter-spacing:.04em}
.tr>b{padding:4px 14px 12px;font-size:16px;text-align:center;font-weight:600}.tr>b.win{color:#1a9c3e}
.tr>b+b{border-left:1px solid var(--line)}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.ch .ph{margin:0 auto}.ch>div{text-align:center;font-weight:700;padding:14px 8px;font-size:14px}
dialog{margin:auto auto 0;width:min(560px,100%);max-height:90vh;overflow:auto;border:0;border-radius:24px 24px 0 0;background:#fff;color:var(--txt);padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sp{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.sp span{color:var(--mut)}.sp b{text-align:right;font-weight:600}
.tres{margin-top:4px;text-align:center;padding:14px;border-radius:16px;background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.3)}
.tres b{display:block;font-size:26px;color:var(--blue)}.tres small{font-size:12px;color:var(--mut)}

.pw{display:grid;place-items:center;overflow:hidden;background:#f5f5f7;border-radius:14px}
.pimg .pw{width:100%;height:100%}
.pw .pimgx,.pimg .pw .pimgx{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;filter:none;transform:scale(var(--z,1))}
.ch .pw{width:100%;max-width:320px;margin:0 auto;aspect-ratio:1.07/1}
dialog .pw{width:100%;max-width:320px;margin:0 auto;aspect-ratio:1.07/1}
@media(min-width:900px){dialog{margin:auto;border-radius:24px}.pb{grid-template-columns:1fr 1fr}}

/* ===== дизайн v15: премиум-светлая тема ===== */
:root{--r:24px}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{background:#1d1d1f;color:#d1d1d6;border:0;letter-spacing:.02em}.top b{color:#ffb340;letter-spacing:.12em}
header{background:rgba(255,255,255,.78);border-bottom:1px solid rgba(0,0,0,.06)}
.card{border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06)}
h1{font-size:clamp(36px,10vw,72px);line-height:1.02;letter-spacing:-.035em;background:linear-gradient(180deg,#1d1d1f 30%,#6a6a72);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(28px,7vw,44px);letter-spacing:-.03em;line-height:1.08}
.hero{padding:40px 0 48px;background:radial-gradient(55% 50% at 10% 0%,rgba(10,132,255,.16),transparent 70%),radial-gradient(45% 45% at 95% 5%,rgba(191,90,242,.14),transparent 70%),radial-gradient(40% 40% at 60% 100%,rgba(255,159,10,.10),transparent 70%),linear-gradient(#fff,#f7f7fa)}
.hero p.lead{font-size:17px}
.btn{border-radius:999px;min-height:54px;font-size:15px;letter-spacing:.01em}
.b-w{box-shadow:0 8px 20px rgba(0,0,0,.18)}
.b-wa{box-shadow:0 8px 20px rgba(37,211,102,.28)}
.b-d{background:#fff}
.stat{padding:16px 16px;border-radius:20px}.stat b{font-size:22px;letter-spacing:-.02em}
.brs{padding:22px;background:linear-gradient(180deg,#fff,#fafafc)}.brs h3{font-size:20px;letter-spacing:-.02em}
.br .btn{min-height:46px}
.sec{padding:56px 0}
.p{padding:14px;border-radius:26px;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.p:nth-child(2){animation-delay:.05s}.p:nth-child(3){animation-delay:.1s}.p:nth-child(4){animation-delay:.15s}.p:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(hover:hover){.p:hover{transform:translateY(-6px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 22px 44px rgba(0,0,0,.12)}}
.pimg{border-radius:20px}.pw{border-radius:20px}
.p h3{font-size:17px;letter-spacing:-.02em;margin-top:14px}
.mem{border-radius:12px;background:#f2f2f4;border-color:transparent}
.mem.on{background:#0a84ff;border-color:#0a84ff;color:#fff}
.pfoot .pr{font-size:21px;letter-spacing:-.02em}
.filters{border-radius:0;box-shadow:0 6px 16px rgba(0,0,0,.04)}
.chip{border-color:transparent}.chip.on{box-shadow:0 4px 12px rgba(0,0,0,.2)}
.search input,input,select{border-radius:16px;background:#fff;border-color:rgba(0,0,0,.12)}
.tbl{border-radius:24px}.tr>b{font-size:17px}
.calc,form.card{padding:22px}
.res{background:linear-gradient(180deg,#fff1f0,#ffe7e5)}.res b{letter-spacing:-.03em}
.tres{background:linear-gradient(180deg,#eaf3ff,#dcebff)}
.map{border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.info .card{border-radius:20px}
dialog{border-radius:28px 28px 0 0}
.dock{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px;border-radius:999px;border:1px solid rgba(0,0,0,.08);box-shadow:0 12px 32px rgba(0,0,0,.18)}
.dock .btn{min-height:48px}
footer{background:#1d1d1f;color:#a1a1a6;border:0;padding:40px 16px calc(40px + 70px)}
footer a{color:#4da3ff!important}
@media(min-width:900px){body{padding-bottom:0}.sec{padding:96px 0}.hero{padding:88px 0 104px}footer{padding:40px 16px}.hgrid{gap:64px}}
@media(prefers-reduced-motion:reduce){.p{animation:none}}

/* ===== v16: воздух, меню, баннер лучшей цены ===== */
.sec{padding:72px 0}.grid{gap:16px}.p{padding:18px}.hgrid{gap:44px}.stats{gap:14px}.info{gap:14px}
@media(min-width:900px){.sec{padding:128px 0}.grid{gap:28px}.hgrid{gap:72px}}
.burger{font-size:20px;line-height:1}
.pm{background:linear-gradient(90deg,#0a84ff,#5e5ce6);color:#fff;text-align:center;padding:14px 16px}
.pm b{display:block;font-size:15px;letter-spacing:-.01em}.pm small{display:block;font-size:11px;opacity:.85;margin-top:3px;line-height:1.4}
.perks{padding:28px 0 0}.perk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.perk{display:flex;gap:10px;align-items:center;padding:14px;border-radius:18px;background:#fff;border:1px solid rgba(0,0,0,.06);font-size:13px;font-weight:600;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.perk b{flex:none;width:26px;height:26px;border-radius:50%;background:#e8f6ec;color:#1a9c3e;display:grid;place-items:center;font-size:14px}
@media(min-width:900px){.perk-grid{grid-template-columns:repeat(4,1fr);gap:20px}.perk{padding:20px;font-size:14px}}
.pmb .box{text-align:center;padding:48px 24px;border-radius:32px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff}
.pmb .box h2{background:none;-webkit-text-fill-color:#fff;color:#fff}.pmb .box small{display:block;margin-top:14px;font-size:12px;opacity:.85;line-height:1.5}
.pmb .btn{margin:22px auto 0;max-width:320px;background:#fff;color:#1d1d1f}
#menu{margin:0 0 0 auto;height:100%;max-height:100%;width:min(340px,88vw);border-radius:28px 0 0 28px;padding:20px 18px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh b{font-size:20px;letter-spacing:-.02em}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 6px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;text-align:left}
.mi em{font-style:normal;font-size:22px;width:30px}.mi.on{color:var(--blue)}

/* ---- цены из Google Таблицы ---- */
function parseCSV(t){const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}
  else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
const normM=x=>String(x).toUpperCase().replace(/\s/g,'').replace('ТБ','TB').replace('ГБ','GB');
function cell(v){v=String(v||'').trim().toLowerCase();if(!v)return null;
 if(['скоро','soon','жақында'].includes(v))return -1;
 const n=parseInt(v.replace(/[.,]\d{1,2}(?!\d)/g,'').replace(/[^\d-]/g,''),10);
 return(!isNaN(n)&&n>=50000&&n<=3000000)?n:undefined}  /* пусто = «по запросу»; число вне 50 000–3 000 000 не принимается, остаётся прежняя цена */
function dbg(m){console.info('[прайс] '+m);if(!/[?&]debug/.test(location.search))return;
 let d=$('dbg');if(!d){d=document.createElement('div');d.id='dbg';d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#222;color:#fff;border:1px solid #666;border-radius:10px;padding:10px;font:13px/1.4 sans-serif';document.body.appendChild(d)}d.textContent=m}
async function loadSheet(){
 if(!/^https:\/\/docs\.google\.com\//.test(SHEET_CSV)){dbg('SHEET_CSV пустой или не начинается с https://docs.google.com/ — берутся цены из кода');return}
 try{
  const r=await fetch(SHEET_CSV+(SHEET_CSV.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok){dbg('Таблица не загрузилась, код ответа '+r.status+'. Проверьте публикацию.');return}
  const rows=parseCSV(await r.text()).slice(1);let hit=0;const bad=[],miss=[];let smp='';
  rows.forEach(x=>{
   const name=(x[0]||'').trim().toLowerCase();
   if(name==='adj'){const a=parseInt(String(x[2]).replace(/[^\d-]/g,''),10);ADJ=(!isNaN(a)&&Math.abs(a)<=100000)?a:0;hit++;return}
   const p=[...P,...DEV,...ACC].find(m=>m.n.toLowerCase()===name);if(!p){if(name)miss.push(x[0]);return}
   const o=p.o.find(m=>normM(m[0])===normM(x[1]));if(!o){miss.push(x[0]+' '+x[1]);return}
   if(!smp)smp=p.n+' '+o[0]+': SIM «'+String(x[2]).trim()+'»';
   [[1,2],[2,3]].forEach(([k,c])=>{const v=cell(x[c]);if(v===undefined)bad.push(p.n+' '+o[0]+': «'+String(x[c]).trim()+'»');else o[k]=v});hit++});
  dbg(hit?'Таблица загружена, обновлено строк: '+hit+(miss.length?'. НЕ НАЙДЕНЫ строки: '+miss.join('; '):'')+(smp?'. Первая строка: '+smp:'')+(bad.length?'. НЕ ПРИНЯТЫ цены (нужно число от 50000 до 3000000): '+bad.join('; '):''):'Таблица прочитана, но модели и память не совпали с названиями из шаблона');
  if(hit){renderGrid();renderCmp();renderShow()}
 }catch(e){dbg('Ошибка чтения таблицы. Нужен формат CSV и публикация в интернете.')}
}
loadSheet();
</script>
